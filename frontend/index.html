<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySprint</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>📚 StudySprint</h1>
        <p>Log your study sessions. See your daily total.</p>
    </header>

    <main>

        <!-- Add Study Session -->
        <section>
            <h2>Add Study Session</h2>

            <form id="study-form">

                <div>
                    <label for="subject">Subject</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="e.g. Data Structures"
                        required
                    >
                </div>

                <div>
                    <label for="topic">Topic</label>
                    <input
                        type="text"
                        id="topic"
                        name="topic"
                        placeholder="e.g. Sorting Algorithms"
                        required
                    >
                </div>


                    
                <div class="duration-group">
                    <label>Duration</label>
                    <div class="time-inputs">
                        <input
                            type="number"
                            id="hours"
                            name="hours"
                            placeholder="Hours"
                            min="0"
                        >
                        <input
                            type="number"
                            id="minutes"
                            name="minutes"
                            placeholder="Minutes"
                            min="0"
                            max="59"
                        >
                    </div>
                    <p id="duration-error"></p>
                </div>

                <button type="submit">+ Add Session</button>

            </form>
        </section>


        <!-- Today's Sessions -->
        <section>
            <h2>Today's Sessions</h2>

            <div id="sessions-list"></div>
        </section>


        <!-- Total Study Time -->
        <section>
            <h2>Total Study Time</h2>

            <p id="total-time">0m</p>
        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>StudySprint © 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
